name: Validar painel PG Tech Operações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pg-tech-operacoes-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar sintaxe e executar regressões
        run: npm run check
      - name: Verificar alterações de espaços e conflitos
        run: git diff --check HEAD^ HEAD
